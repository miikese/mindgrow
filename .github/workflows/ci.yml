name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:local
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          node scripts/create-qa-fixtures.mjs
          APP_ENV_FILE=outputs/browser-qa/owner.env APP_STATE_DIR=/tmp/mindgrow-ci PORT=3102 npm run local > /tmp/app.log 2>&1 &
          python scripts/e2e.py || { cat /tmp/app.log; exit 1; }
          python scripts/e2e-expansion.py
          python scripts/e2e-rules-exams.py
          python scripts/e2e-admin-access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: outputs/browser-qa/*.png
